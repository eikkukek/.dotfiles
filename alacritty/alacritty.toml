#[terminal.shell]
#program = "/home/eikku/bin/alacritty_tmux.sh"

general.import = ["~/.config/alacritty/themes/p3.toml"]

[window]
padding.x = 0
padding.y = 0
dynamic_title = true
opacity = 0.8

[font]
normal.family = "Hack Nerd Font"
bold.family = "Hack Nerd Font"
italic.family = "Hack Nerd Font"
bold_italic.family = "Hack Nerd Font"
size = 11.0

[keyboard]
bindings = [
    { key = "+", mods = "Control", action = "ReceiveChar" },
    { key = "-", mods = "Control", action = "ReceiveChar" },
]
